[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-headers-redact"
version = "0.1.0"
description = "Framework-agnostic middleware that redacts credentials from HTTP headers (Authorization, Cookie, X-API-Key, Stripe-Signature, etc.)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
keywords = ["headers", "redact", "credentials", "middleware", "wsgi", "asgi", "authorization"]
dependencies = [
    "tiny-secret-mask>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-headers-redact"
Repository = "https://github.com/hussain-alsaibai/tiny-headers-redact"

[tool.setuptools]
py-modules = ["tiny_headers_redact"]

